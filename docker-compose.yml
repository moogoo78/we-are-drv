# Production run config. Build + run with:  docker compose up -d --build
services:
  web:
    build: .
    image: we-are-drv
    container_name: we-are-drv
    restart: unless-stopped
    # Bind to localhost; front it with your own reverse proxy (see compose.traefik.yml).
    ports:
      - "127.0.0.1:8020:8080"
    depends_on:
      - api

  api:
    build: ./api
    image: we-are-drv-api
    container_name: we-are-drv-api
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DATABASE_PATH: /app/data/drv.sqlite3
      UPLOAD_DIR: /app/uploads
      # 縣市設定（選填，預設基隆市）：api/app/sites/<名稱>.json 的檔名，例：SITE_CONFIG=yilan
      SITE_CONFIG: ${SITE_CONFIG:-}
      # Email 通知（選填；未設定時通知會列為「待發送」，可匯出名單人工寄送）
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - apidata:/app/data
      - uploads:/app/uploads

volumes:
  apidata:
  uploads:
